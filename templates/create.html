<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Create Card</title></head>
  <body>
    <h1>Create Card</h1>
    <form method="post" enctype="multipart/form-data">
      <label>Name <input name="name" required /></label><br />
      <label>Variant <input name="variant" /></label><br />
      <label>CollectionName <input name="collection_name" /></label><br />
      <label>Number <input name="number" /></label><br />
      <label>CollectionNumber <input name="collection_number" /></label><br />
      <label>Quantity <input name="quantity" type="number" min="0" value="1" /></label><br />
      <label>Value <input name="value" type="number" step="0.01" value="0.0" /></label><br />
      <label>Picture <input name="picture" type="file" accept="image/*" /></label><br />
      <label>Extra Data JSON <textarea name="extra_data">{}</textarea></label><br />
      <button type="submit">Create</button>
    </form>
    <p><a href="/cards">View cards</a></p>
  </body>
</html>
