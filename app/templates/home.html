{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Welcome, {{ user.username }}!</h1>
    <p class="text-muted">
        Manage your trading card collection.
    </p>
</div>

<div class="surface p-4">
    <div class="d-flex flex-wrap gap-2">
        <a href="/cards" class="btn btn-primary">
            <i class="bi bi-grid-3x3-gap me-1"></i>
            View My Cards
        </a>

        <a href="/cards/create" class="btn btn-outline-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Add New Card
        </a>

        <a href="/cards/crop_card" class="btn btn-outline-primary">
            <i class="bi bi-crop me-1"></i>
            Crop Card Image
        </a>

        {% if user.is_admin %}
        <a
            href="/admin"
            class="btn btn-outline-secondary"
            target="_blank"
        >
            <i class="bi bi-shield-lock me-1"></i>
            Admin Panel
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
