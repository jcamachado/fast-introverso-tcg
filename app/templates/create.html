<!-- app/templates/create.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Add Card</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-back { background: #6c757d; margin-left: 10px; text-decoration: none; padding: 10px 20px; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Add New Card</h1>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Variant:</label>
            <input type="text" name="variant">
        </div>
        <div class="form-group">
            <label>Collection Name:</label>
            <input type="text" name="collection_name">
        </div>
        <div class="form-group">
            <label>Number:</label>
            <input type="text" name="number">
        </div>
        <div class="form-group">
            <label>Collection Number:</label>
            <input type="text" name="collection_number">
        </div>
        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" name="quantity" value="1" min="1">
        </div>
        <div class="form-group">
            <label>Value ($):</label>
            <input type="number" name="value" step="0.01" value="0">
        </div>
        <div class="form-group">
            <label>Extra Data (JSON):</label>
            <textarea name="extra_data" rows="3" placeholder='{"rarity": "rare", "condition": "mint"}'></textarea>
        </div>
        <div class="form-group">
            <label>Picture:</label>
            <input type="file" name="picture" accept="image/*">
        </div>
        <button type="submit">Create Card</button>
        <a href="/cards" class="btn-back">Cancel</a>
    </form>
</body>
</html>
